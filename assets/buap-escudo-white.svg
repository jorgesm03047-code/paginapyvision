<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="80" height="80">
  <!-- BUAP Escudo - Minerva Shield (White version for dark backgrounds) -->
  <defs>
    <radialGradient id="helmetGradW" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="60%" stop-color="#E8920A"/>
      <stop offset="100%" stop-color="#B87020"/>
    </radialGradient>
    <radialGradient id="aquaGradW" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5BC8DC"/>
      <stop offset="100%" stop-color="#2A9BB5"/>
    </radialGradient>
    <linearGradient id="helmetSilverW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
  </defs>

  <!-- Aqua flowing oval background -->
  <ellipse cx="52" cy="52" rx="46" ry="44" fill="url(#aquaGradW)" opacity="0.75"/>
  <ellipse cx="56" cy="50" rx="38" ry="36" fill="url(#aquaGradW)" opacity="0.5" transform="rotate(-12, 56, 50)"/>

  <!-- Orange/Yellow inner oval -->
  <ellipse cx="50" cy="54" rx="30" ry="34" fill="url(#helmetGradW)" opacity="0.95"/>

  <!-- Minerva Helmet - Side profile (stylized) -->
  <g transform="translate(24, 14)">
    <!-- Helmet crest / plume -->
    <path d="M 24 2 C 20 0, 16 4, 18 8 C 20 12, 24 10, 26 8 L 28 12 C 26 16, 22 20, 22 28 L 28 28 L 28 12 C 30 10, 34 6, 30 2 Z" fill="url(#helmetSilverW)"/>
    <!-- Helmet bowl -->
    <path d="M 14 28 C 12 22, 14 14, 22 12 C 28 10, 34 14, 34 22 L 34 34 C 32 40, 20 42, 14 38 Z" fill="url(#helmetSilverW)"/>
    <!-- Face opening -->
    <path d="M 18 24 C 16 26, 16 32, 18 36 C 20 40, 26 42, 28 38 L 28 28 C 24 28, 20 26, 18 24 Z" fill="#546E7A"/>
    <!-- Head silhouette inside -->
    <ellipse cx="24" cy="34" rx="7" ry="9" fill="#37474F" opacity="0.8"/>
    <!-- Helmet chin guard -->
    <path d="M 16 36 C 14 40, 16 46, 22 48 L 28 46 L 28 38 C 24 40, 18 40, 16 36 Z" fill="url(#helmetSilverW)"/>
    <!-- BUAP text on helmet -->
    <text x="15" y="22" font-family="Arial, sans-serif" font-weight="700" font-size="5" fill="#FFFFFF" opacity="0.9" letter-spacing="0.5">BUAP</text>
  </g>

  <!-- Aqua swirl arcs around -->
  <path d="M 8 22 C 0 34, 2 62, 16 78" fill="none" stroke="#5BC8DC" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 10 17 C 0 32, 0 66, 18 82" fill="none" stroke="#2A9BB5" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 92 28 C 100 44, 98 68, 82 82" fill="none" stroke="#5BC8DC" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
