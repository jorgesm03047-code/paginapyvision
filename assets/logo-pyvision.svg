<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="160" height="40">
  <defs>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Stylized Eye Icon - Matching official PyVision brand -->
  <g transform="translate(8, 10)">
    <!-- Outer Eye Shape (double-lid almond) -->
    <path d="M 30 30 C 15 10, 55 10, 70 30 C 55 50, 15 50, 30 30 Z" fill="none" stroke="#1E1E24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="logo-eye-outer"/>
    <!-- Upper eyelid accent -->
    <path d="M 22 28 C 30 12, 60 12, 68 28" fill="none" stroke="#1E1E24" stroke-width="4" stroke-linecap="round" class="logo-eye-outer"/>
    <!-- Inner eyelid curves -->
    <path d="M 28 38 C 35 46, 55 46, 62 38" fill="none" stroke="#1E1E24" stroke-width="2.5" stroke-linecap="round" class="logo-eye-outer"/>
    <path d="M 30 42 C 38 48, 52 48, 60 42" fill="none" stroke="#1E1E24" stroke-width="2" stroke-linecap="round" class="logo-eye-outer"/>
    <!-- Iris -->
    <circle cx="46" cy="30" r="12" fill="none" stroke="#1E1E24" stroke-width="4" class="logo-eye-outer"/>
    <!-- Pupil -->
    <circle cx="46" cy="30" r="5" fill="#1E1E24" class="logo-eye-fill"/>
    <!-- Pupil highlight -->
    <circle cx="43" cy="27" r="2.5" fill="#FFFFFF"/>
  </g>
  <!-- Typography -->
  <text x="95" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="30" fill="#1E1E24" letter-spacing="-0.5" class="logo-text-main">PyVision</text>
  <text x="96" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#7B2CBF" letter-spacing="3.5" class="logo-text-sub">SOLUTIONS</text>
</svg>
