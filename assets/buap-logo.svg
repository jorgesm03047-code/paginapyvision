<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="280" height="60">
  <!-- FCC BUAP Logo - Faithful SVG Recreation from reference image -->
  <defs>
    <radialGradient id="helmetGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="60%" stop-color="#E8920A"/>
      <stop offset="100%" stop-color="#B87020"/>
    </radialGradient>
    <radialGradient id="aquaGrad" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#5BC8DC"/>
      <stop offset="100%" stop-color="#2A9BB5"/>
    </radialGradient>
    <linearGradient id="helmetSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="50%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
  </defs>

  <!-- Aqua flowing oval background -->
  <ellipse cx="52" cy="46" rx="46" ry="40" fill="url(#aquaGrad)" opacity="0.75"/>
  <ellipse cx="56" cy="44" rx="38" ry="32" fill="url(#aquaGrad)" opacity="0.5" transform="rotate(-12, 56, 44)"/>

  <!-- Orange/Yellow inner oval -->
  <ellipse cx="50" cy="48" rx="30" ry="32" fill="url(#helmetGrad)" opacity="0.95"/>

  <!-- Minerva Helmet - Side profile (stylized) -->
  <g transform="translate(26, 12)">
    <!-- Helmet crest / plume -->
    <path d="M 24 2 C 20 0, 16 4, 18 8 C 20 12, 24 10, 26 8 L 28 12 C 26 16, 22 20, 22 28 L 28 28 L 28 12 C 30 10, 34 6, 30 2 Z" fill="url(#helmetSilver)"/>
    <!-- Helmet bowl -->
    <path d="M 14 28 C 12 22, 14 14, 22 12 C 28 10, 34 14, 34 22 L 34 34 C 32 40, 20 42, 14 38 Z" fill="url(#helmetSilver)"/>
    <!-- Face opening -->
    <path d="M 18 24 C 16 26, 16 32, 18 36 C 20 40, 26 42, 28 38 L 28 28 C 24 28, 20 26, 18 24 Z" fill="#546E7A"/>
    <!-- Head silhouette inside -->
    <ellipse cx="24" cy="34" rx="7" ry="9" fill="#37474F" opacity="0.8"/>
    <!-- Helmet chin guard -->
    <path d="M 16 36 C 14 40, 16 46, 22 48 L 28 46 L 28 38 C 24 40, 18 40, 16 36 Z" fill="url(#helmetSilver)"/>
    <!-- BUAP text on helmet -->
    <text x="15" y="22" font-family="Arial, sans-serif" font-weight="700" font-size="5" fill="#FFFFFF" opacity="0.9" letter-spacing="0.5">BUAP</text>
    <text x="18" y="30" font-family="Arial, sans-serif" font-weight="700" font-size="4" fill="#FFFFFF" opacity="0.9">FCC</text>
  </g>

  <!-- Aqua swirl arcs around -->
  <path d="M 8 20 C 0 30, 2 55, 16 70" fill="none" stroke="#5BC8DC" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 10 15 C 0 28, 0 60, 18 75" fill="none" stroke="#2A9BB5" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 92 25 C 100 40, 98 62, 82 75" fill="none" stroke="#5BC8DC" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Typography: "Facultad de Cs. de la Computación" -->
  <text x="115" y="32" font-family="'Plus Jakarta Sans', 'Arial Black', Arial, sans-serif" font-weight="800" font-size="24" fill="#003B46" letter-spacing="-0.3">Facultad de</text>
  <text x="115" y="62" font-family="'Plus Jakarta Sans', 'Arial Black', Arial, sans-serif" font-weight="800" font-size="24" fill="#003B46" letter-spacing="-0.3">Cs. de la Computación</text>
</svg>
